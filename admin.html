<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administração | Amar Angola</title><link rel="stylesheet" href="/painel.css"><script defer src="/painel.js"></script></head><body><main><header><h1>Amar Angola</h1><a href="/">Site institucional</a></header><p id="status" role="status" aria-live="polite"></p><section id="login" hidden><h2>Acesso administrativo</h2><form id="loginForm"><label>Usuário<input name="username" autocomplete="username" required maxlength="100"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><section id="dashboard" hidden><header><h2>Visão geral</h2><button id="logout">Sair</button></header><div class="cards"><article>Doações registradas<strong id="doacoes">—</strong></article><article>Apadrinhamentos<strong id="padrinhos">—</strong></article><article>Visitas contabilizadas<strong id="visitas">—</strong></article></div><h2>Atualizar totais</h2><p>Controle provisório de totais; não substitui o histórico financeiro.</p><form id="statsForm"><label>Doações (R$)<input name="doacoes" type="number" min="0" max="9999999999.99" step="0.01" required></label><label>Apadrinhamentos<input name="padrinhos" type="number" min="0" max="2147483647" step="1" required></label><button>Salvar totais</button></form></section></main></body></html>
